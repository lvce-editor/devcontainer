name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  pr:
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-24.04,
            ubuntu-24.04-arm,
            macos-26,
            windows-2025,
            windows-11-arm,
          ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run build
      - run: npm test
      - name: Install Playwright Chromium
        run: npm run install:chromium --prefix packages/e2e
        if: matrix.os == 'ubuntu-24.04'
      - name: Verify Docker
        run: docker version
        if: matrix.os == 'ubuntu-24.04'
      - name: Pull devcontainer e2e images
        run: |
          docker pull mcr.microsoft.com/devcontainers/javascript-node:24
          docker pull mcr.microsoft.com/devcontainers/base:ubuntu24.04
          docker pull gcc:14-bookworm
          docker pull golang:1.24-bookworm
          docker pull perl:5.40-slim-bookworm
          docker pull php:8.4-cli-bookworm
          docker pull python:3.13-slim-bookworm
          docker pull ruby:3.4-slim-bookworm
          docker pull rust:1.85-slim-bookworm
        if: matrix.os == 'ubuntu-24.04'
      - name: Devcontainer Quick Pick and Explorer e2e
        timeout-minutes: 30
        run: npm run e2e:devcontainer
        if: matrix.os == 'ubuntu-24.04'
      - name: Devcontainer direct test URLs and reloads
        timeout-minutes: 15
        run: npm run e2e:local-url --prefix packages/e2e
        if: matrix.os == 'ubuntu-24.04'
      - name: Diagnose reopen test failure
        if: failure() && matrix.os == 'ubuntu-24.04'
        run: npm run e2e:local-url --prefix packages/e2e -- test/reopen-debug.test.js
      - run: npm run type-check
      - run: npm run lint
