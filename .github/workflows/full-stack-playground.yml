name: Full stack playground
# eslint-disable github-actions/on -- workflow_call is a supported reusable-workflow event
on:
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: full-stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - run: npm ci
      - name: Restore prepared full stack assets
        # eslint-disable-next-line github-actions/action-versions -- These sub-actions share the verified actions/cache v6 tag.
        uses: actions/cache/restore@v6
        id: runtime-cache
        with:
          path: .tmp/full-stack/image
          key: full-stack-runtime-${{ runner.os }}-${{ hashFiles('packages/devcontainer-node/src/**', 'packages/devcontainer-worker/src/**', 'packages/playground/full-stack/image/**', 'packages/playground/full-stack/workspace/**', 'packages/playground/full-stack/src/probe.ts', 'packages/playground/full-stack/build-bundle.js', 'packages/playground/full-stack/build-image.sh', 'packages/playground/full-stack/prepare-converter.js', 'package-lock.json') }}
      - name: Build and test the real startup stack
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: bash packages/playground/full-stack/build-image.sh
      - name: Cache the built runtime before browser testing
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        # eslint-disable-next-line github-actions/action-versions -- These sub-actions share the verified actions/cache v6 tag.
        uses: actions/cache/save@v6
        with:
          path: .tmp/full-stack/image
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - run: node packages/playground/full-stack/build-site.js
      - uses: actions/upload-artifact@v7
        with:
          name: full-stack-site
          path: .tmp/full-stack/site
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-stack-native-results
          path: .tmp/full-stack/native.log
  browser:
    needs: build-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: full-stack-site
          path: .tmp/playground/full-stack
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: packages/playground
      - name: Run the real startup cycle
        run: npx playwright test --config full-stack/playwright.config.ts --project ${{ matrix.browser }}
        working-directory: packages/playground
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-stack-${{ matrix.browser }}-results
          path: packages/playground/full-stack/test-results
