name: Linux playground
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - uses: crazy-max/ghaction-github-runtime@v3
      - run: npm ci
      - name: Build Alpine and convert to Wasm
        run: npm run build:image --workspace=packages/playground
      - name: Build static site
        run: npm run build --workspace=packages/playground
      - uses: actions/upload-artifact@v6
        with:
          name: playground-site
          path: .tmp/playground
      - run: npx playwright install --with-deps chromium firefox
        working-directory: packages/playground
      - name: Test real Linux in Chromium and Firefox
        run: npm run test:browser --workspace=packages/playground
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playground-browser-results
          path: |
            packages/playground/playwright-report
            packages/playground/test-results
      - uses: actions/upload-artifact@v7
        with:
          name: playground-site
          path: .tmp/playground
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: .tmp/playground
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy playground
        id: deployment
        uses: actions/deploy-pages@v5
