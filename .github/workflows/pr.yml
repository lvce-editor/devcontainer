name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  pr:
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-24.04,
            ubuntu-24.04-arm,
            macos-26,
            windows-2025,
            windows-11-arm,
          ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.js)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci --ignore-scripts && npm run postinstall
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run build
      - run: npm test
      - name: Verify Docker
        run: docker version
        if: matrix.os == 'ubuntu-24.04'
      - name: Pull devcontainer e2e images
        run: |
          docker pull mcr.microsoft.com/devcontainers/javascript-node:24
          docker pull mcr.microsoft.com/devcontainers/base:ubuntu24.04
        if: matrix.os == 'ubuntu-24.04'
      - run: npm run e2e:devcontainer
        if: matrix.os == 'ubuntu-24.04'
      - run: npm run type-check
      - run: npm run lint
